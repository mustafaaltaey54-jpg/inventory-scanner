<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>نظام مخزون الموصل</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:18px;text-align:center;font-size:21px;font-weight:700}
.container{max-width:520px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.hidden{display:none!important}.title{font-size:24px;font-weight:700;text-align:center;margin-bottom:10px}.barcode{text-align:center;color:#6b7280;font-size:14px}
.stock{text-align:center;font-size:34px;font-weight:700;margin:18px 0 4px}.label{text-align:center;color:#6b7280}.info{background:#f9fafb;padding:12px;border-radius:12px;margin-top:8px}
button{width:100%;border:0;border-radius:14px;padding:16px;margin-top:10px;font-size:18px;font-weight:700}.primary{background:#111827;color:#fff}.receive{background:#16a34a;color:#fff}.issue{background:#dc2626;color:#fff}.count{background:#2563eb;color:#fff}.secondary{background:#e5e7eb;color:#111827}
button:disabled{opacity:.6}input{width:100%;padding:15px;border:1px solid #d1d5db;border-radius:12px;font-size:20px;text-align:center}.message{margin-top:12px;padding:14px;border-radius:12px;text-align:center;white-space:pre-line}.success{background:#dcfce7;color:#166534}.error{background:#fee2e2;color:#991b1b}.warning{background:#fef3c7;color:#92400e}
#reader{width:100%;overflow:hidden;border-radius:16px;background:#000}
</style>
</head>
<body>
<header>نظام مخزون الموصل</header>
<div class="container">
<section id="home" class="card">
  <div class="title">📦 المخزون</div>
  <button class="primary" onclick="startScanner()">📷 مسح الباركود</button>
</section>

<section id="scannerCard" class="card hidden">
  <div id="reader"></div>
  <button class="secondary" onclick="stopScanner()">إلغاء</button>
</section>

<section id="productCard" class="card hidden">
  <div id="productName" class="title">-</div>
  <div id="productBarcode" class="barcode">-</div>
  <div class="info">التصنيف: <strong id="productCategory">-</strong></div>
  <div class="info">الوحدة: <strong id="productUnit">-</strong></div>
  <div id="productStock" class="stock">0</div>
  <div class="label">الرصيد الحالي</div>
  <button class="receive" onclick="openTransaction('receive')">📥 استلام</button>
  <button class="issue" onclick="openTransaction('issue')">📤 صرف</button>
  <button class="count" onclick="openTransaction('count')">📊 جرد</button>
  <button class="secondary" onclick="startScanner()">📷 مسح صنف آخر</button>
</section>

<section id="transactionCard" class="card hidden">
  <div id="transactionTitle" class="title">-</div>
  <div class="info">الصنف: <strong id="transactionProduct">-</strong></div>
  <div class="info">الرصيد الحالي: <strong id="transactionStock">0</strong></div>
  <br>
  <input id="quantity" type="number" min="0" step="1" inputmode="numeric" placeholder="أدخل الكمية">
  <button id="confirmButton" class="primary" onclick="submitTransaction()">تأكيد</button>
  <button class="secondary" onclick="cancelTransaction()">إلغاء</button>
  <div id="transactionMessage"></div>
</section>
</div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbxjArHofijvSsT8gb_YiVKziygG2z6YDeMVOhOetH4PIG5svVZQ2MBRJoAMwTBI0RvG/exec';
let scanner=null, scanning=false, currentProduct=null, currentAction=null;

function startScanner(){
  stopScanner();
  home.classList.add('hidden'); productCard.classList.add('hidden'); transactionCard.classList.add('hidden'); scannerCard.classList.remove('hidden');
  scanner=new Html5Qrcode('reader'); scanning=true;
  scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:140},aspectRatio:1.777},async text=>{
    if(!scanning)return; scanning=false; await stopScanner(); searchProduct(text);
  },()=>{}).catch(()=>{scanning=false; alert('تعذر تشغيل الكاميرا.'); goHome();});
}
async function stopScanner(){
  scanning=false;
  if(scanner){try{await scanner.stop()}catch(e){} try{scanner.clear()}catch(e){} scanner=null;}
  scannerCard.classList.add('hidden');
}
function searchProduct(barcode){
  jsonp('find',{barcode},data=>{
    if(!data || !data.success){alert('تعذر الاتصال بقاعدة البيانات.');return goHome();}
    if(!data.found){alert('⚠️ الصنف غير موجود\n\nBarcode:\n'+barcode);return goHome();}
    currentProduct=data.product; showProduct();
  });
}
function showProduct(){
  productName.textContent=currentProduct.name; productBarcode.textContent=currentProduct.barcode; productCategory.textContent=currentProduct.category; productUnit.textContent=currentProduct.unit; productStock.textContent=currentProduct.currentStock; productCard.classList.remove('hidden');
}
function openTransaction(action){
  currentAction=action; productCard.classList.add('hidden'); transactionCard.classList.remove('hidden'); quantity.value=''; transactionMessage.className='';
  transactionTitle.textContent=action==='receive'?'📥 استلام بضاعة':action==='issue'?'📤 صرف بضاعة':'📊 جرد المخزون';
  transactionProduct.textContent=currentProduct.name; transactionStock.textContent=currentProduct.currentStock;
}
function submitTransaction(){
  const q=Number(quantity.value);
  if(!Number.isFinite(q)||q<0||((currentAction!=='count')&&q<=0)){return showMessage('أدخل كمية صحيحة.','error');}
  if(currentAction==='issue'&&q>Number(currentProduct.currentStock))return showMessage('⚠️ الكمية أكبر من الرصيد الحالي.','error');
  confirmButton.disabled=true; confirmButton.textContent='جاري التسجيل...';
  jsonp(currentAction,{barcode:currentProduct.barcode,quantity:q,user:'Mobile User',notes:''},data=>{
    if(!data || !data.success){showMessage(data&&data.error?data.error:'فشلت العملية.','error');resetButton();return;}
    jsonp('find',{barcode:currentProduct.barcode},fresh=>{
      if(!fresh || !fresh.success || !fresh.found){showMessage('تمت العملية لكن تعذر تحديث الرصيد.','warning');resetButton();return;}
      currentProduct=fresh.product; showMessage('✅ تمت العملية بنجاح\nالرصيد الجديد: '+currentProduct.currentStock,'success'); resetButton();
      setTimeout(()=>{transactionCard.classList.add('hidden');showProduct()},1200);
    });
  });
}
function jsonp(action,params,handler){
  const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*10000);
  window[cb]=function(data){try{handler(data)}finally{delete window[cb];const s=document.getElementById(cb);if(s)s.remove()}};
  const s=document.createElement('script'); s.id=cb;
  const q=new URLSearchParams({action,callback:cb,t:Date.now().toString(),...params});
  s.src=API_URL+'?'+q.toString();
  s.onerror=()=>{delete window[cb];s.remove();handler({success:false,error:'Server connection failed'})};
  document.body.appendChild(s);
}
function resetButton(){confirmButton.disabled=false;confirmButton.textContent='تأكيد'}
function showMessage(msg,type){transactionMessage.className='message '+type;transactionMessage.textContent=msg}
function cancelTransaction(){transactionCard.classList.add('hidden');productCard.classList.remove('hidden')}
function goHome(){scannerCard.classList.add('hidden');productCard.classList.add('hidden');transactionCard.classList.add('hidden');home.classList.remove('hidden')}
</script>
</body>
</html>
