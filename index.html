<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta
name="theme-color"
content="#111827">

<title>نظام مخزون الموصل</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 18px;
    text-align: center;
    font-size: 21px;
    font-weight: bold;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: 18px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 4px 18px rgba(0,0,0,.08);
}

.hidden {
    display: none !important;
}

.title {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 12px;
}

.barcode {
    text-align: center;
    color: #6b7280;
    font-size: 14px;
    direction: ltr;
}

.info {
    background: #f9fafb;
    padding: 13px;
    border-radius: 12px;
    margin-top: 8px;
}

.stock {
    text-align: center;
    font-size: 34px;
    font-weight: bold;
    margin: 20px 0 4px;
}

.stockLabel {
    text-align: center;
    color: #6b7280;
}

button {
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 16px;
    margin-top: 10px;
    font-size: 18px;
    font-weight: bold;
}

button:disabled {
    opacity: .6;
}

.primary {
    background: #111827;
    color: white;
}

.receive {
    background: #16a34a;
    color: white;
}

.issue {
    background: #dc2626;
    color: white;
}

.count {
    background: #2563eb;
    color: white;
}

.secondary {
    background: #e5e7eb;
    color: #111827;
}

.test {
    background: #7c3aed;
    color: white;
}

input {
    width: 100%;
    padding: 16px;
    font-size: 22px;
    text-align: center;
    border: 1px solid #d1d5db;
    border-radius: 12px;
}

.message {
    margin-top: 12px;
    border-radius: 12px;
    padding: 14px;
    text-align: center;
    white-space: pre-line;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.warning {
    background: #fef3c7;
    color: #92400e;
}

.status {
    margin-top: 12px;
    padding: 14px;
    border-radius: 12px;
    text-align: center;
    white-space: pre-line;
}

#reader {
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    background: #000;
}

</style>

</head>

<body>

<header>
نظام مخزون الموصل
</header>

<div class="container">


<!-- HOME -->

<section
id="home"
class="card">

<div class="title">
📦 المخزون
</div>

<button
class="primary"
onclick="startScanner()">

📷 مسح الباركود

</button>

<button
id="testButton"
class="test"
onclick="testConnection()">

🔌 اختبار الاتصال بالخادم

</button>

<div
id="connectionStatus"
class="hidden">
</div>

</section>


<!-- SCANNER -->

<section
id="scannerCard"
class="card hidden">

<div id="reader"></div>

<button
class="secondary"
onclick="stopScanner()">

إلغاء

</button>

</section>


<!-- PRODUCT -->

<section
id="productCard"
class="card hidden">

<div
id="productName"
class="title">
-
</div>

<div
id="productBarcode"
class="barcode">
-
</div>

<div class="info">

التصنيف:

<strong id="productCategory">
-
</strong>

</div>

<div class="info">

الوحدة:

<strong id="productUnit">
-
</strong>

</div>

<div
id="productStock"
class="stock">
0
</div>

<div class="stockLabel">
الرصيد الحالي
</div>

<button
class="receive"
onclick="openTransaction('receive')">

📥 استلام

</button>

<button
class="issue"
onclick="openTransaction('issue')">

📤 صرف

</button>

<button
class="count"
onclick="openTransaction('count')">

📊 جرد

</button>

<button
class="secondary"
onclick="startScanner()">

📷 مسح صنف آخر

</button>

</section>


<!-- TRANSACTION -->

<section
id="transactionCard"
class="card hidden">

<div
id="transactionTitle"
class="title">
-
</div>

<div class="info">

الصنف:

<strong id="transactionProduct">
-
</strong>

</div>

<div class="info">

الرصيد الحالي:

<strong id="transactionStock">
0
</strong>

</div>

<br>

<input
id="quantity"
type="number"
min="0"
step="1"
inputmode="numeric"
placeholder="أدخل الكمية">

<button
id="confirmButton"
class="primary"
onclick="submitTransaction()">

تأكيد

</button>

<button
class="secondary"
onclick="cancelTransaction()">

إلغاء

</button>

<div
id="transactionMessage">
</div>

</section>

</div>


<script>


/* =====================================================
   APPS SCRIPT WEB APP
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycby2vB0JJ-yiXS00FgsyTCjtQQ0xkDqVBwP1Y5HmiCDx68RUbEquLZxYRPUU3ZwH4X5gEQ/exec";

let scanner = null;

let scanning = false;

let currentProduct = null;

let currentAction = null;


/* =====================================================
   JSONP
===================================================== */

function jsonp(url, callback) {

    const callbackName =
        "inventoryCallback_" +
        Date.now() +
        "_" +
        Math.floor(
            Math.random() * 100000
        );


    const script =
        document.createElement("script");


    let finished = false;


    const timeout =
        setTimeout(
            function() {

                if (finished) {
                    return;
                }

                cleanup();

                callback(
                    new Error(
                        "Server timeout"
                    ),
                    null
                );

            },
            15000
        );


    function cleanup() {

        if (finished) {
            return;
        }

        finished = true;

        clearTimeout(timeout);


        try {

            delete window[
                callbackName
            ];

        }

        catch (e) {}


        if (
            script.parentNode
        ) {

            script.parentNode
                .removeChild(script);

        }

    }


    window[callbackName] =
        function(data) {

            cleanup();

            callback(
                null,
                data
            );

        };


    script.src =
        url +
        (
            url.indexOf("?") >= 0
                ? "&"
                : "?"
        ) +
        "callback=" +
        encodeURIComponent(
            callbackName
        ) +
        "&_=" +
        Date.now();


    script.onerror =
        function() {

            cleanup();

            callback(

                new Error(
                    "Network error"
                ),

                null

            );

        };


    document.body.appendChild(
        script
    );

}


/* =====================================================
   TEST CONNECTION
===================================================== */

function testConnection() {

   const url =
    API_URL +
    "?action=test" +
    "&_=" +
    Date.now();


    const status =
        document.getElementById(
            "connectionStatus"
        );


    button.disabled = true;

    button.textContent =
        "⏳ جاري الاختبار...";


    status.className =
        "status warning";

    status.textContent =
        "جاري الاتصال بـ Apps Script...";

    status.classList.remove(
        "hidden"
    );


    const url =
        API_URL +
        "?action=test" +
        "&_=" +
        Date.now();


    jsonp(

        url,

        function(error, data) {

            button.disabled = false;

            button.textContent =
                "🔌 اختبار الاتصال بالخادم";


            if (error) {

                status.className =
                    "status error";


                status.textContent =
                    "❌ فشل الاتصال بالخادم\n\n" +
                    error.message;


                return;

            }


            if (
                data &&
                data.success === true
            ) {

                status.className =
                    "status success";


                status.textContent =
                    "✅ الاتصال يعمل بنجاح\n\n" +
                    "Apps Script متصل.";

            }

            else {

                status.className =
                    "status error";


                status.textContent =
                    "❌ الخادم رد ولكن توجد مشكلة\n\n" +
                    (
                        data &&
                        data.error
                            ? data.error
                            : "Unknown error"
                    );

            }

        }

    );

}


/* =====================================================
   CAMERA
===================================================== */

async function startScanner() {

    await stopScanner();


    hideAll();


    document
        .getElementById(
            "scannerCard"
        )
        .classList.remove(
            "hidden"
        );


    scanner =
        new Html5Qrcode(
            "reader"
        );


    scanning = true;


    try {

        await scanner.start(

            {
                facingMode:
                    "environment"
            },

            {
                fps: 10,

                qrbox: {
                    width: 280,
                    height: 140
                },

                aspectRatio: 1.777
            },


            async function(decodedText) {

                if (!scanning) {
                    return;
                }


                scanning = false;


                await stopScanner();


                searchProduct(
                    decodedText
                );

            },


            function() {}

        );

    }

    catch (error) {

        scanning = false;


        alert(
            "تعذر تشغيل الكاميرا.\n\n" +
            error
        );


        showHome();

    }

}


/* =====================================================
   STOP CAMERA
===================================================== */

async function stopScanner() {

    scanning = false;


    if (scanner) {

        try {
            await scanner.stop();
        }

        catch (e) {}


        try {
            scanner.clear();
        }

        catch (e) {}


        scanner = null;

    }


    document
        .getElementById(
            "scannerCard"
        )
        .classList.add(
            "hidden"
        );

}


/* =====================================================
   SEARCH
===================================================== */

function searchProduct(barcode) {

    barcode =
        String(
            barcode || ""
        ).trim();


    const url =
        API_URL +
        "?action=find" +
        "&barcode=" +
        encodeURIComponent(
            barcode
        ) +
        "&_=" +
        Date.now();


    jsonp(

        url,

        function(error, data) {

            if (error) {

                alert(
                    "حدث خطأ في الاتصال بالخادم.\n\n" +
                    error.message
                );

                showHome();

                return;

            }


            if (
                !data ||
                data.success !== true
            ) {

                alert(

                    "خطأ:\n" +

                    (
                        data &&
                        data.error
                            ? data.error
                            : "Unknown error"
                    )

                );

                showHome();

                return;

            }


            if (!data.found) {

                alert(

                    "⚠️ الصنف غير موجود\n\n" +
                    "Barcode:\n" +
                    barcode

                );

                showHome();

                return;

            }


            currentProduct =
                data.product;


            showProduct();

        }

    );

}


/* =====================================================
   SHOW PRODUCT
===================================================== */

function showProduct() {

    hideAll();


    document
        .getElementById(
            "productName"
        )
        .textContent =
        currentProduct.name;


    document
        .getElementById(
            "productBarcode"
        )
        .textContent =
        currentProduct.barcode;


    document
        .getElementById(
            "productCategory"
        )
        .textContent =
        currentProduct.category;


    document
        .getElementById(
            "productUnit"
        )
        .textContent =
        currentProduct.unit;


    document
        .getElementById(
            "productStock"
        )
        .textContent =
        currentProduct.currentStock;


    document
        .getElementById(
            "productCard"
        )
        .classList.remove(
            "hidden"
        );

}


/* =====================================================
   OPEN TRANSACTION
===================================================== */

function openTransaction(action) {

    currentAction =
        action;


    hideAll();


    const titles = {

        receive:
            "📥 استلام بضاعة",

        issue:
            "📤 صرف بضاعة",

        count:
            "📊 جرد المخزون"

    };


    document
        .getElementById(
            "transactionTitle"
        )
        .textContent =
        titles[action];


    document
        .getElementById(
            "transactionProduct"
        )
        .textContent =
        currentProduct.name;


    document
        .getElementById(
            "transactionStock"
        )
        .textContent =
        currentProduct.currentStock;


    document
        .getElementById(
            "quantity"
        )
        .value = "";


    document
        .getElementById(
            "transactionMessage"
        )
        .textContent = "";


    document
        .getElementById(
            "transactionMessage"
        )
        .className = "";


    resetButton();


    document
        .getElementById(
            "transactionCard"
        )
        .classList.remove(
            "hidden"
        );

}


/* =====================================================
   SUBMIT
===================================================== */

function submitTransaction() {

    const quantity =
        Number(
            document
                .getElementById(
                    "quantity"
                )
                .value
        );


    if (
        !Number.isFinite(quantity)
    ) {

        showMessage(
            "أدخل كمية صحيحة.",
            "error"
        );

        return;

    }


    if (quantity < 0) {

        showMessage(
            "الكمية لا يمكن أن تكون سالبة.",
            "error"
        );

        return;

    }


    if (
        currentAction !== "count" &&
        quantity <= 0
    ) {

        showMessage(
            "يجب أن تكون الكمية أكبر من صفر.",
            "error"
        );

        return;

    }


    if (
        currentAction === "issue" &&
        quantity >
        Number(
            currentProduct.currentStock
        )
    ) {

        showMessage(
            "⚠️ الكمية أكبر من الرصيد الحالي.",
            "error"
        );

        return;

    }


    const button =
        document.getElementById(
            "confirmButton"
        );


    button.disabled = true;

    button.textContent =
        "جاري التسجيل...";


    const url =
        API_URL +
        "?action=" +
        encodeURIComponent(
            currentAction
        ) +

        "&barcode=" +
        encodeURIComponent(
            currentProduct.barcode
        ) +

        "&quantity=" +
        encodeURIComponent(
            quantity
        ) +

        "&user=" +
        encodeURIComponent(
            "Mobile User"
        ) +

        "&notes=" +
        encodeURIComponent(
            ""
        ) +

        "&_=" +
        Date.now();


    jsonp(

        url,

        function(error, data) {

            if (error) {

                showMessage(

                    "حدث خطأ في الاتصال بالخادم.\n\n" +
                    error.message,

                    "error"

                );


                resetButton();

                return;

            }


            if (
                !data ||
                data.success !== true
            ) {

                showMessage(

                    "فشلت العملية:\n" +

                    (
                        data &&
                        data.error
                            ? data.error
                            : "Unknown error"
                    ),

                    "error"

                );


                resetButton();

                return;

            }


            if (
                data.transaction &&
                data.transaction.stockAfter !== undefined
            ) {

                currentProduct.currentStock =
                    Number(
                        data.transaction.stockAfter
                    );

            }


            showMessage(

                "✅ تمت العملية بنجاح\n" +
                "الرصيد الجديد: " +
                currentProduct.currentStock,

                "success"

            );


            button.textContent =
                "تمت العملية";


            setTimeout(

                function() {

                    resetButton();

                    showProduct();

                },

                1500

            );

        }

    );

}


/* =====================================================
   RESET BUTTON
===================================================== */

function resetButton() {

    const button =
        document.getElementById(
            "confirmButton"
        );


    button.disabled = false;

    button.textContent =
        "تأكيد";

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    message,
    type
) {

    const element =
        document.getElementById(
            "transactionMessage"
        );


    element.className =
        "message " +
        type;


    element.textContent =
        message;

}


/* =====================================================
   CANCEL
===================================================== */

function cancelTransaction() {

    showProduct();

}


/* =====================================================
   HOME
===================================================== */

function showHome() {

    hideAll();


    document
        .getElementById(
            "home"
        )
        .classList.remove(
            "hidden"
        );

}


/* =====================================================
   HIDE ALL
===================================================== */

function hideAll() {

    [

        "home",
        "scannerCard",
        "productCard",
        "transactionCard"

    ]

    .forEach(

        function(id) {

            document
                .getElementById(id)
                .classList.add(
                    "hidden"
                );

        }

    );

}


/* =====================================================
   INITIAL
===================================================== */

window.addEventListener(

    "load",

    function() {

        showHome();

    }

);

</script>

</body>

</html>
