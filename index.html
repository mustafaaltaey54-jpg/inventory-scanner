<!DOCTYPE html>

<html
lang="ar"
dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<meta
name="theme-color"
content="#111827">

<title>
نظام مخزون الموصل
</title>


<script
src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
</script>


<style>

* {
    box-sizing:border-box;
}


body {

    margin:0;

    font-family:
        Arial,
        sans-serif;

    background:#f3f4f6;

    color:#111827;

}


header {

    background:#111827;

    color:white;

    text-align:center;

    padding:18px;

    font-size:21px;

    font-weight:bold;

}


.container {

    max-width:520px;

    margin:auto;

    padding:18px;

}


.card {

    background:white;

    border-radius:18px;

    padding:20px;

    margin-bottom:16px;

    box-shadow:
        0 4px 18px rgba(0,0,0,.08);

}


.hidden {

    display:none !important;

}


.title {

    text-align:center;

    font-size:24px;

    font-weight:bold;

    margin-bottom:12px;

}


.barcode {

    text-align:center;

    color:#6b7280;

    font-size:14px;

}


.stock {

    text-align:center;

    font-size:34px;

    font-weight:bold;

    margin:20px 0 5px 0;

}


.stockLabel {

    text-align:center;

    color:#6b7280;

}


.info {

    background:#f9fafb;

    padding:12px;

    border-radius:12px;

    margin-top:8px;

}


button {

    width:100%;

    border:0;

    border-radius:14px;

    padding:16px;

    margin-top:10px;

    font-size:18px;

    font-weight:bold;

}


button:disabled {

    opacity:.6;

}


.primary {

    background:#111827;

    color:white;

}


.receive {

    background:#16a34a;

    color:white;

}


.issue {

    background:#dc2626;

    color:white;

}


.count {

    background:#2563eb;

    color:white;

}


.secondary {

    background:#e5e7eb;

    color:#111827;

}


input {

    width:100%;

    padding:15px;

    border:
        1px solid #d1d5db;

    border-radius:12px;

    font-size:20px;

    text-align:center;

}


.message {

    margin-top:12px;

    padding:14px;

    border-radius:12px;

    text-align:center;

    white-space:pre-line;

}


.success {

    background:#dcfce7;

    color:#166534;

}


.error {

    background:#fee2e2;

    color:#991b1b;

}


.warning {

    background:#fef3c7;

    color:#92400e;

}


#reader {

    width:100%;

    overflow:hidden;

    border-radius:16px;

    background:#000;

}

</style>

</head>


<body>


<header>

نظام مخزون الموصل

</header>


<div class="container">


<!-- ==================================================
     HOME
================================================== -->

<section
id="home"
class="card">


<div class="title">

📦 المخزون

</div>


<button
class="primary"
onclick="startScanner()">

📷 مسح الباركود

</button>


</section>



<!-- ==================================================
     SCANNER
================================================== -->

<section
id="scannerCard"
class="card hidden">


<div id="reader"></div>


<button
class="secondary"
onclick="stopScanner()">

إلغاء

</button>


</section>



<!-- ==================================================
     PRODUCT
================================================== -->

<section
id="productCard"
class="card hidden">


<div
id="productName"
class="title">

-

</div>


<div
id="productBarcode"
class="barcode">

-

</div>


<div class="info">

التصنيف:

<strong
id="productCategory">

-

</strong>

</div>


<div class="info">

الوحدة:

<strong
id="productUnit">

-

</strong>

</div>


<div
id="productStock"
class="stock">

0

</div>


<div class="stockLabel">

الرصيد الحالي

</div>


<button
class="receive"
onclick="openTransaction('receive')">

📥 استلام

</button>


<button
class="issue"
onclick="openTransaction('issue')">

📤 صرف

</button>


<button
class="count"
onclick="openTransaction('count')">

📊 جرد

</button>


<button
class="secondary"
onclick="startScanner()">

📷 مسح صنف آخر

</button>


</section>



<!-- ==================================================
     TRANSACTION
================================================== -->

<section
id="transactionCard"
class="card hidden">


<div
id="transactionTitle"
class="title">

-

</div>


<div class="info">

الصنف:

<strong
id="transactionProduct">

-

</strong>

</div>


<div class="info">

الرصيد الحالي:

<strong
id="transactionStock">

0

</strong>

</div>


<br>


<input
id="quantity"
type="number"
min="0"
step="1"
inputmode="numeric"
placeholder="أدخل الكمية">


<button
id="confirmButton"
class="primary"
onclick="submitTransaction()">

تأكيد

</button>


<button
class="secondary"
onclick="cancelTransaction()">

إلغاء

</button>


<div
id="transactionMessage">
</div>


</section>


</div>


<!-- ==================================================
     HIDDEN POST FRAME
================================================== -->

<iframe
name="hiddenSubmitFrame"
id="hiddenSubmitFrame"
style="display:none">
</iframe>


<script>


/* =====================================================
   API URL
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxjArHofijvSsT8gb_YiVKziygG2z6YDeMVOhOetH4PIG5svVZQ2MBRJoAMwTBI0RvG/exec";


let scanner = null;

let scanning = false;

let currentProduct = null;

let currentAction = null;


/* =====================================================
   START CAMERA
===================================================== */

async function startScanner() {


    await stopScanner();


    document
        .getElementById("home")
        .classList.add("hidden");


    document
        .getElementById("productCard")
        .classList.add("hidden");


    document
        .getElementById("transactionCard")
        .classList.add("hidden");


    document
        .getElementById("scannerCard")
        .classList.remove("hidden");


    scanner =
        new Html5Qrcode(
            "reader"
        );


    scanning = true;


    try {


        await scanner.start(

            {
                facingMode:
                    "environment"
            },


            {

                fps:10,

                qrbox:
                {
                    width:280,

                    height:140
                },

                aspectRatio:1.777

            },


            async function(decodedText) {


                if (!scanning)
                    return;


                scanning = false;


                await stopScanner();


                searchProduct(
                    decodedText
                );


            },


            function(errorMessage) {

                // تجاهل أخطاء المسح المؤقتة

            }

        );


    }

    catch(error) {


        scanning = false;


        alert(
            "تعذر تشغيل الكاميرا."
        );


        document
            .getElementById("scannerCard")
            .classList.add("hidden");


        document
            .getElementById("home")
            .classList.remove("hidden");

    }

}


/* =====================================================
   STOP CAMERA
===================================================== */

async function stopScanner() {


    scanning = false;


    if (scanner) {

        try {

            await scanner.stop();

        }
        catch(e) {}


        try {

            scanner.clear();

        }
        catch(e) {}


        scanner = null;

    }


    document
        .getElementById("scannerCard")
        .classList.add("hidden");

}


/* =====================================================
   SEARCH PRODUCT - JSONP
===================================================== */

function searchProduct(
    barcode
) {


    const callbackName =
        "barcodeCallback_" +
        Date.now();


    window[callbackName] =
        function(data) {


            try {


                if (
                    !data ||
                    !data.success
                ) {

                    alert(
                        "تعذر الاتصال بقاعدة البيانات."
                    );

                    goHome();

                    return;

                }


                if (!data.found) {

                    alert(
                        "⚠️ الصنف غير موجود\n\n" +
                        "Barcode:\n" +
                        barcode
                    );

                    goHome();

                    return;

                }


                currentProduct =
                    data.product;


                showProduct();


            }


            finally {


                delete window[
                    callbackName
                ];


                const script =
                    document.getElementById(
                        "barcodeLookupScript"
                    );


                if (script) {

                    script.remove();

                }

            }

        };


    const script =
        document.createElement(
            "script"
        );


    script.id =
        "barcodeLookupScript";


    script.src =
        API_URL +
        "?action=find" +
        "&barcode=" +
        encodeURIComponent(
            barcode
        ) +
        "&callback=" +
        callbackName +
        "&t=" +
        Date.now();


    script.onerror =
        function() {


            alert(
                "تعذر الاتصال بقاعدة البيانات."
            );


            goHome();


            delete window[
                callbackName
            ];


            script.remove();

        };


    document
        .body
        .appendChild(
            script
        );

}


/* =====================================================
   SHOW PRODUCT
===================================================== */

function showProduct() {


    document
        .getElementById(
            "productName"
        )
        .textContent =
        currentProduct.name;


    document
        .getElementById(
            "productBarcode"
        )
        .textContent =
        currentProduct.barcode;


    document
        .getElementById(
            "productCategory"
        )
        .textContent =
        currentProduct.category;


    document
        .getElementById(
            "productUnit"
        )
        .textContent =
        currentProduct.unit;


    document
        .getElementById(
            "productStock"
        )
        .textContent =
        currentProduct.currentStock;


    document
        .getElementById(
            "productCard"
        )
        .classList.remove(
            "hidden"
        );

}


/* =====================================================
   OPEN TRANSACTION
===================================================== */

function openTransaction(
    action
) {


    currentAction =
        action;


    document
        .getElementById(
            "productCard"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "transactionCard"
        )
        .classList.remove(
            "hidden"
        );


    document
        .getElementById(
            "quantity"
        )
        .value = "";


    document
        .getElementById(
            "transactionMessage"
        )
        .className = "";


    const titles = {

        receive:
            "📥 استلام بضاعة",

        issue:
            "📤 صرف بضاعة",

        count:
            "📊 جرد المخزون"

    };


    document
        .getElementById(
            "transactionTitle"
        )
        .textContent =
        titles[action];


    document
        .getElementById(
            "transactionProduct"
        )
        .textContent =
        currentProduct.name;


    document
        .getElementById(
            "transactionStock"
        )
        .textContent =
        currentProduct.currentStock;

}


/* =====================================================
   SUBMIT TRANSACTION
===================================================== */

function submitTransaction() {


    const quantity =
        Number(
            document
                .getElementById(
                    "quantity"
                )
                .value
        );


    if (
        !Number.isFinite(
            quantity
        )
    ) {

        showMessage(
            "أدخل كمية صحيحة.",
            "error"
        );

        return;

    }


    if (
        quantity < 0
    ) {

        showMessage(
            "الكمية لا يمكن أن تكون سالبة.",
            "error"
        );

        return;

    }


    if (
        currentAction !== "count" &&
        quantity <= 0
    ) {

        showMessage(
            "يجب أن تكون الكمية أكبر من صفر.",
            "error"
        );

        return;

    }


    if (
        currentAction === "issue" &&
        quantity >
        Number(
            currentProduct.currentStock
        )
    ) {

        showMessage(
            "⚠️ الكمية أكبر من الرصيد الحالي.",
            "error"
        );

        return;

    }


    const button =
        document
            .getElementById(
                "confirmButton"
            );


    button.disabled = true;


    button.textContent =
        "جاري التسجيل...";


    /*
      Hidden POST form
    */

    const form =
        document.createElement(
            "form"
        );


    form.method =
        "POST";


    form.action =
        API_URL;


    form.target =
        "hiddenSubmitFrame";


    form.style.display =
        "none";


    addHiddenField(
        form,
        "action",
        currentAction
    );


    addHiddenField(
        form,
        "barcode",
        currentProduct.barcode
    );


    addHiddenField(
        form,
        "quantity",
        quantity
    );


    addHiddenField(
        form,
        "user",
        "Mobile User"
    );


    addHiddenField(
        form,
        "notes",
        ""
    );


    document
        .body
        .appendChild(
            form
        );


    form.submit();


    form.remove();


    /*
      بعد إعطاء Apps Script وقتًا للتحديث،
      نعيد قراءة الرصيد.
    */

    setTimeout(
        function() {

            refreshProductAfterTransaction();

        },
        1800
    );

}


/* =====================================================
   ADD FORM FIELD
===================================================== */

function addHiddenField(
    form,
    name,
    value
) {


    const input =
        document.createElement(
            "input"
        );


    input.type =
        "hidden";


    input.name =
        name;


    input.value =
        value;


    form.appendChild(
        input
    );

}


/* =====================================================
   REFRESH AFTER TRANSACTION
===================================================== */

function refreshProductAfterTransaction() {


    const barcode =
        currentProduct.barcode;


    const callbackName =
        "refreshCallback_" +
        Date.now();


    window[callbackName] =
        function(data) {


            try {


                if (
                    !data ||
                    !data.success ||
                    !data.found
                ) {

                    showMessage(
                        "تعذر قراءة الرصيد الجديد.",
                        "error"
                    );

                    resetConfirmButton();

                    return;

                }


                currentProduct =
                    data.product;


                showMessage(

                    "✅ تمت العملية بنجاح\n" +
                    "الرصيد الجديد: " +
                    currentProduct.currentStock,

                    "success"

                );


                resetConfirmButton();


                setTimeout(
                    function() {

                        document
                            .getElementById(
                                "transactionCard"
                            )
                            .classList
                            .add(
                                "hidden"
                            );


                        showProduct();

                    },
                    1500
                );


            }


            finally {


                delete window[
                    callbackName
                ];


                const script =
                    document.getElementById(
                        "refreshProductScript"
                    );


                if (script) {

                    script.remove();

                }

            }

        };


    const script =
        document.createElement(
            "script"
        );


    script.id =
        "refreshProductScript";


    script.src =
        API_URL +
        "?action=find" +
        "&barcode=" +
        encodeURIComponent(
            barcode
        ) +
        "&callback=" +
        callbackName +
        "&t=" +
        Date.now();


    script.onerror =
        function() {


            showMessage(

                "تم إرسال العملية، " +
                "لكن تعذر قراءة الرصيد الجديد.",

                "warning"

            );


            resetConfirmButton();


            delete window[
                callbackName
            ];


            script.remove();

        };


    document
        .body
        .appendChild(
            script
        );

}


/* =====================================================
   RESET BUTTON
===================================================== */

function resetConfirmButton() {


    const button =
        document
            .getElementById(
                "confirmButton"
            );


    button.disabled =
        false;


    button.textContent =
        "تأكيد";

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    message,
    type
) {


    const element =
        document
            .getElementById(
                "transactionMessage"
            );


    element.className =
        "message " +
        type;


    element.textContent =
        message;

}


/* =====================================================
   CANCEL
===================================================== */

function cancelTransaction() {


    document
        .getElementById(
            "transactionCard"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "productCard"
        )
        .classList.remove(
            "hidden"
        );

}


/* =====================================================
   HOME
===================================================== */

function goHome() {


    document
        .getElementById(
            "scannerCard"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "productCard"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "transactionCard"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "home"
        )
        .classList.remove(
            "hidden"
        );

}

</script>

</body>

</html>
