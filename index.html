<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>نظام مخزون الموصل</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}header{background:#111827;color:#fff;padding:18px;text-align:center;font-size:21px;font-weight:700}main{max-width:520px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 3px 15px #0001;margin-bottom:16px}button{width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}#reader{width:100%;overflow:hidden;border-radius:16px;background:#000;min-height:280px}.status{padding:12px;border-radius:12px;background:#f3f4f6;margin-top:12px;text-align:center}.result{font-size:20px;font-weight:700;text-align:center;padding:12px}.small{font-size:13px;color:#6b7280;text-align:center;line-height:1.7}.hidden{display:none}
</style></head>
<body><header>نظام مخزون الموصل</header><main>
<section id="home" class="card"><div class="result">📦 قارئ الباركود</div><p class="small">النسخة الأولى لاختبار الكاميرا وقراءة Barcode / QR فقط. لا يوجد ربط بـ Google Sheets بعد.</p><button id="startBtn" class="primary">📷 مسح الباركود</button></section>
<section id="scannerCard" class="card hidden"><div id="reader"></div><div id="status" class="status">جاري تشغيل الكاميرا...</div><br><button id="stopBtn" class="secondary">إيقاف الكاميرا</button></section>
<section id="resultCard" class="card hidden"><div class="result">✅ تم قراءة الباركود</div><div id="code" class="result"></div><button id="againBtn" class="primary">📷 مسح باركود آخر</button></section>
</main>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>
let scanner=null,running=false;const home=document.getElementById('home'),scannerCard=document.getElementById('scannerCard'),resultCard=document.getElementById('resultCard'),status=document.getElementById('status'),code=document.getElementById('code');function setStatus(t){status.textContent=t}
async function startScanner(){if(running)return;home.classList.add('hidden');resultCard.classList.add('hidden');scannerCard.classList.remove('hidden');setStatus('جاري طلب صلاحية الكاميرا...');try{scanner=new Html5Qrcode('reader');running=true;await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:140},aspectRatio:1.777,formatsToSupport:[Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.CODE_93,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.QR_CODE]},async decodedText=>{if(!running)return;running=false;code.textContent=decodedText;try{await scanner.stop()}catch(e){}try{scanner.clear()}catch(e){}scannerCard.classList.add('hidden');resultCard.classList.remove('hidden')},()=>{});setStatus('وجّه الكاميرا إلى الباركود')}catch(err){running=false;setStatus('تعذر تشغيل الكاميرا. تأكد من HTTPS ومنح Chrome صلاحية الكاميرا.');console.error(err)}}
async function stopScanner(){if(scanner&&running){running=false;try{await scanner.stop()}catch(e){}try{scanner.clear()}catch(e){}}scannerCard.classList.add('hidden');resultCard.classList.add('hidden');home.classList.remove('hidden')}
document.getElementById('startBtn').onclick=startScanner;document.getElementById('stopBtn').onclick=stopScanner;document.getElementById('againBtn').onclick=startScanner;
</script></body></html>
